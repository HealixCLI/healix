name: Version bump

# ON-DEMAND ONLY. Run this manually (Actions -> Version bump -> Run workflow)
# to bump the desktop app's version and commit it back to main. It no longer
# fires on every push/merge — the version changes only when you ask it to,
# e.g. right before cutting a release.

on:
  workflow_dispatch:
    inputs:
      level:
        description: 'Semver level to bump'
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: version-bump-main
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump desktop version
        id: bump
        env:
          LEVEL: ${{ inputs.level }}
        run: |
          set -euo pipefail
          # Bump only the version field for the chosen level; preserve key order
          # + 2-space + trailing newline so the file stays prettier-clean.
          new=$(node -e '
            const fs = require("fs");
            const p = "apps/desktop/package.json";
            const j = JSON.parse(fs.readFileSync(p, "utf8"));
            const [maj, min, pat] = j.version.split(".").map(Number);
            const lvl = process.env.LEVEL || "patch";
            const v = lvl === "major" ? [maj + 1, 0, 0]
                    : lvl === "minor" ? [maj, min + 1, 0]
                    : [maj, min, pat + 1];
            j.version = v.join(".");
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
            console.log(j.version);
          ')
          echo "version=${new}" >> "$GITHUB_OUTPUT"
          echo "Bumped desktop version (${LEVEL}) to ${new}"

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/desktop/package.json
          git commit -m "chore(release): bump version to ${{ steps.bump.outputs.version }} [skip ci]"
          # Reconcile with anything that landed on main while we were bumping.
          git pull --rebase origin main
          git push origin HEAD:main
